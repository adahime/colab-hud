<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="COLAB-HUD Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="15%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#f9ab00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f9ab00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="84%" cy="24%" r="38%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="220" rx="16" fill="url(#bgGrad)" stroke="#263143" stroke-width="1.5"/>
  <rect width="920" height="220" rx="16" fill="url(#glowAmber)"/>
  <rect width="920" height="220" rx="16" fill="url(#glowCyan)"/>

  <!-- Subtle grid accent -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="55" x2="920" y2="55"/>
    <line x1="0" y1="165" x2="920" y2="165"/>
    <line x1="185" y1="0" x2="185" y2="220"/>
  </g>

  <!-- Colab rings + telemetry emblem -->
  <g transform="translate(106, 114)">
    <circle cx="0" cy="-4" r="56" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M -14 -24 A 18 18 0 1 0 -14 12 C -6 12 -1 6 1 0" fill="none" stroke="#f9ab00" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M 14 -24 A 18 18 0 1 1 14 12 C 6 12 1 6 -1 0" fill="none" stroke="#e8710a" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M -32 24 L -16 24 L -10 15 L -2 29 L 6 19 L 12 24 L 32 24" fill="none" stroke="#06b6d4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34" cy="-34" r="5" fill="#22c55e"/>
    <text x="0" y="42" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.2">CU / HR</text>
  </g>

  <!-- Title & badges -->
  <text x="212" y="88" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="1.5">COLAB-HUD</text>

  <rect x="470" y="61" width="66" height="24" rx="12" fill="#271c0a" stroke="#f9ab00" stroke-width="1"/>
  <text x="503" y="77" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#fcd34d">v0.1.0</text>

  <text x="214" y="122" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    Live GPU/TPU Model, Compute Unit Balance &amp; Hourly Burn-Rate HUD for Google Colab
  </text>

  <!-- Feature pills -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="11.5" font-weight="600">
    <rect x="212" y="148" width="144" height="28" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="1"/>
    <text x="284" y="166" text-anchor="middle" fill="#4ade80">CU BALANCE &amp; RATE</text>

    <rect x="366" y="148" width="154" height="28" rx="6" fill="#0c1e35" stroke="#0891b2" stroke-width="1"/>
    <text x="443" y="166" text-anchor="middle" fill="#22d3ee">nvidia-smi PROBE</text>

    <rect x="530" y="148" width="146" height="28" rx="6" fill="#271c0a" stroke="#d97706" stroke-width="1"/>
    <text x="603" y="166" text-anchor="middle" fill="#fbbf24">KEYRING OAUTH2</text>

    <rect x="686" y="148" width="146" height="28" rx="6" fill="#18181b" stroke="#52525b" stroke-width="1"/>
    <text x="759" y="166" text-anchor="middle" fill="#e4e4e7">EN / 中文 TOGGLE</text>
  </g>
</svg>
